[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "embodiment-berkeley-humanoid-lite"
version = "0.1.0"
description = "Simulation-only Berkeley Humanoid Lite plugin for Embodiment Gateway"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["embodiment-gateway>=0.1,<1"]

[project.scripts]
embodiment-humanoid-lite = "embodiment_berkeley_humanoid_lite.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
