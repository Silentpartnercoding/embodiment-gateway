[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "embodiment-gateway"
version = "0.1.0"
description = "Hardware-neutral execution gateway for digest-bound judgments"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
