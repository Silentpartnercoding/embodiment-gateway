name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install all three distributions
        run: |
          python -m pip install -e .
          python -m pip install -e adapters/so101
          python -m pip install -e adapters/berkeley-humanoid-lite
      - name: Test gateway core
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Exercise packaged protocol CLI
        run: |
          embodiment-gateway contracts --output-dir /tmp/embodiment-contracts
          test -f /tmp/embodiment-contracts/root-judgment.v1.schema.json
          test -f /tmp/embodiment-contracts/receipt.v1.schema.json
      - name: Test SO-101 adapter
        run: python -m unittest discover -s adapters/so101/tests -p 'test_*.py' -v
      - name: Test humanoid simulation adapter
        run: >-
          python -m unittest discover
          -s adapters/berkeley-humanoid-lite/tests -p 'test_*.py' -v
      - name: Build all three distributions
        run: |
          python -m pip install --upgrade build
          python -m build --outdir dist/gateway .
          python -m build --outdir dist/so101 adapters/so101
          python -m build --outdir dist/humanoid adapters/berkeley-humanoid-lite
